# Web pública del Dojo en Cloudflare (gratis): sirve docs/ tal cual y la API de cuentas en /api/*.
name = "dojo"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./docs"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dojo"
database_id = "7e2db5aa-3d3b-461c-8d7c-35ff375995b3"
migrations_dir = "worker/migraciones"

[[routes]]
pattern = "dojo.tonykansaiguide.com"
custom_domain = true
