<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Dojo: simulacros gratis de AWS Solutions Architect, TOEFL, IELTS y JLPT N5, y hiragana, katakana y kanji explicados fácil.">
<meta name="theme-color" content="#f2ede3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13110e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dojo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dojo · simulacros y kana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Atkinson+Hyperlegible:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&family=Yuji+Syuku&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.27/dist/lenis.css">
<style>
/* Identidad «dojo»: papel washi, tinta sumi y el sello rojo (hanko). Cada examen conserva su color para orientarse. */
:root{
  --paper:#f2ede3; --sheet:#fbf8f2; --ink:#191612; --ink-2:#5a5248; --line:#ddd4c4; --bubble:#e9e2d4; --sumi:#191612; --on-sumi:#f2ede3;
  --hanko:#c8361d; --pt:#0b7a4b; --ru:#2a52be; --aws:#b4560a; --toefl:#1f5f99; --ielts:#b02a38; --n5:#5a3e9e; --accent:var(--hanko);
  --ok:#1f7a4c; --ok-bg:#dff0e3; --bad:#b8321f; --bad-bg:#f7e1db; --warn:#a96d12; --warn-bg:#f6ead0;
  --shadow:0 1px 0 rgba(25,22,18,.05),0 18px 40px -24px rgba(25,22,18,.45);
  --f-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-brush:"Yuji Syuku","Zen Kaku Gothic New",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13110e; --sheet:#1c1915; --ink:#efe8db; --ink-2:#b0a594; --line:#342e26; --bubble:#29241e; --sumi:#0b0a08; --on-sumi:#efe8db;
  --hanko:#ef6a4c; --pt:#3fc58a; --ru:#7d9cf0; --aws:#f2a052; --toefl:#69a9e6; --ielts:#ee7a85; --n5:#ab94ee;
  --ok:#5cc88f; --ok-bg:#15301f; --bad:#f08470; --bad-bg:#3a1c16; --warn:#e5b45a; --warn-bg:#382b12;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13110e; --sheet:#1c1915; --ink:#efe8db; --ink-2:#b0a594; --line:#342e26; --bubble:#29241e; --sumi:#0b0a08; --on-sumi:#efe8db;
  --hanko:#ef6a4c; --pt:#3fc58a; --ru:#7d9cf0; --aws:#f2a052; --toefl:#69a9e6; --ielts:#ee7a85; --n5:#ab94ee;
  --ok:#5cc88f; --ok-bg:#15301f; --bad:#f08470; --bad-bg:#3a1c16; --warn:#e5b45a; --warn-bg:#382b12;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -20px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
body[data-x="kana"]{--accent:var(--n5)} body[data-x="pt"]{--accent:var(--pt)} body[data-x="ru"]{--accent:var(--ru)} body[data-x="aws"]{--accent:var(--aws)} body[data-x="toefl"]{--accent:var(--toefl)} body[data-x="ielts"]{--accent:var(--ielts)} body[data-x="n5"]{--accent:var(--n5)}
.jp,[lang="ja"]{font-family:var(--f-jp)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font:700 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:800 20px var(--f-display);background:none;border:0;padding:0}
.brand-mark{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;position:relative}
.brand-mark::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--accent);transition:background .3s}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 12px;border-radius:999px;font-weight:700;color:var(--ink-2)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.stats{display:flex;gap:14px;align-items:center;font:700 14px var(--f-mono)}
.stat{display:flex;align-items:center;gap:5px}
.flame{width:14px;height:18px}
.sync{font:500 11px var(--f-mono);color:var(--ink-2)}

/* portada */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;padding-block:40px 24px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 30%,transparent) 62%)}
.hero p{max-width:52ch;font-size:18px;color:var(--ink-2)}
.today{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:grid;gap:14px}
.ring{display:flex;gap:16px;align-items:center}
.ring svg{flex:none}
.goal-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bubble);font:700 12px var(--f-mono)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.exams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-block:8px 32px}
.exam-card{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;overflow:hidden}
.exam-card:hover{transform:translateY(-2px);border-color:var(--c)}
.exam-card .tag{font:800 30px var(--f-display);color:var(--c)}
.exam-card .dots{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.exam-card .dots i{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line)}
.exam-card .dots i.done{background:var(--c);border-color:var(--c)}
.exam-card .dots i.pass{background:var(--c);border-color:var(--c);box-shadow:0 0 0 2px var(--sheet),0 0 0 3.5px var(--c)}
.exam-card .meta{display:flex;justify-content:space-between;gap:8px;font:700 13px var(--f-mono);color:var(--ink-2)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-block:28px 14px;flex-wrap:wrap}
.sec-title h2{font-size:26px}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--ink-2);font-size:14px}
.badge.on{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--sheet)}
.badge b{font-family:var(--f-display)}

/* vista de examen */
.ex-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-block:28px 8px}
.ex-head h1{font-size:clamp(30px,5vw,46px);font-weight:800}
.ex-head h1 span{color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-block:12px 20px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:700;color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:grid;gap:6px;justify-items:center;text-align:center;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile .n{font:800 22px var(--f-display)}
.tile .b{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 10px var(--f-mono)}
.tile.done .b{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.tile.easy{border-style:dashed}
.tile small{font:700 11px var(--f-mono);color:var(--ink-2)}
.mode-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--bubble);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{font-size:19px;margin-bottom:8px}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.drill{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:grid;gap:6px}
.drill:hover{border-color:var(--accent)}
.drill .bar{height:6px;border-radius:3px;background:var(--bubble);overflow:hidden}
.drill .bar i{display:block;height:100%;background:var(--accent)}
.trick{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding-block:14px;border-bottom:1px solid var(--line)}
.trick:last-child{border-bottom:0}
.trick .k{font:800 13px var(--f-mono);color:var(--accent);padding-top:3px}
.trick h4{margin:0;font:700 17px var(--f-display)}
.trick p{margin:0;grid-column:2;color:var(--ink-2);max-width:68ch}
table.fmt{width:100%;border-collapse:collapse;font-size:15px}
table.fmt th,table.fmt td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.fmt th{font:700 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.scroll-x{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}

/* corredor de preguntas */
.run{min-height:100%;display:grid;grid-template-rows:auto 1fr auto}
.run-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.run-top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center}
.progress{flex:1;height:8px;border-radius:4px;background:var(--bubble);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.timer{font:700 15px var(--f-mono)}
.timer.low{color:var(--bad)}
.x-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.stage{max-width:1080px;margin:0 auto;padding:20px 16px 120px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;width:100%}
.stage.solo{grid-template-columns:minmax(0,720px);justify-content:center}
.ctx{position:sticky;top:70px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:20px;max-height:calc(100vh - 110px);overflow:auto}
.ctx .passage{white-space:pre-wrap;font-size:16.5px;line-height:1.7;max-width:65ch}
.qbox{display:grid;gap:16px;min-width:0}
.qtask{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtext{font-size:20px;line-height:1.5;font-weight:700;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .bub{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink-2);display:grid;place-items:center;font:700 13px var(--f-mono);transition:all .15s}
.opt.sel{border-color:var(--accent)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--sheet);transform:scale(1.05)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.fill-in{width:100%;font:600 19px var(--f-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.order-line{min-height:58px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.order-pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 12px;font-weight:700;font-size:17px}
.chip:hover{border-color:var(--accent)}
.chip.star{border-color:var(--accent)}
.feedback{border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.feedback.ok{background:var(--ok-bg)} .feedback.bad{background:var(--bad-bg)}
.feedback b{font-family:var(--f-display);font-size:17px}
.audio-box{display:grid;gap:12px;justify-items:start}
.play{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--sheet);border:0;border-radius:999px;padding:12px 20px;font-weight:800}
.play:disabled{opacity:.45;cursor:not-allowed}
.wave{display:flex;gap:3px;height:22px;align-items:center}
.wave i{width:4px;border-radius:2px;background:var(--accent);height:30%;opacity:.5}
.wave.on i{animation:wv .9s ease-in-out infinite;opacity:1}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}
@keyframes wv{50%{height:100%}}
textarea.write{width:100%;min-height:240px;font:17px/1.6 var(--f-body);padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);resize:vertical}
.rubric{display:grid;gap:10px}
.rub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.model{white-space:pre-wrap;background:var(--bubble);border-radius:12px;padding:14px;font-size:15.5px;max-height:340px;overflow:auto}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:1080px;margin:0 auto;display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:800;background:var(--ink);color:var(--paper)}
.btn.acc{background:var(--accent);color:var(--sheet)}
.btn.ghost{background:var(--bubble);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.kbd{font:600 11px var(--f-mono);color:var(--ink-2)}

/* resultados */
.score-hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding-block:28px}
.big{font:800 clamp(64px,12vw,110px)/.9 var(--f-display);color:var(--accent);letter-spacing:-.03em}
.secbars{display:grid;gap:10px}
.secbar{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:14px}
.secbar .t{height:10px;background:var(--bubble);border-radius:5px;overflow:hidden}
.secbar .t i{display:block;height:100%;background:var(--accent)}
.review{display:grid;gap:12px}
.rv{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--sheet);display:grid;gap:6px}
.rv .q{font-weight:700;white-space:pre-wrap}

/* tarjetas (desliza) */
.deck{position:relative;height:340px;max-width:460px;margin:0 auto;touch-action:pan-y}
.fc{position:absolute;inset:0;background:var(--sheet);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px;display:grid;align-content:center;gap:12px;text-align:center;user-select:none;transition:transform .25s,opacity .25s}
.fc .front{font-size:22px;font-weight:700;white-space:pre-wrap}
.fc .back{color:var(--ink-2);font-size:15px}
.deck-ctrl{display:flex;justify-content:center;gap:12px;margin-top:18px}
.rayo-num{font:800 72px/1 var(--f-display);color:var(--accent)}
.combo{font:800 18px var(--f-mono);color:var(--warn)}

/* tutor y recordatorios */
.chat{display:grid;gap:10px;max-height:420px;overflow:auto;padding:4px}
.msg{padding:10px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap}
.msg.me{background:var(--accent);color:var(--sheet);justify-self:end}
.msg.ai{background:var(--bubble)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.inp,select.inp{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;box-shadow:var(--shadow)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);color:var(--ink);border-radius:14px;padding:12px 16px;margin-top:16px}
mark{background:color-mix(in srgb,var(--warn) 28%,transparent);color:inherit;border-radius:4px;padding:0 3px}
.opt.multi .bub{border-radius:8px}
.prio{position:absolute;top:16px;right:16px;background:var(--c);color:var(--sheet);font:800 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px}
.exam-card.big-card{grid-column:1/-1}
.full-tile{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sheet);border:2px solid var(--accent);border-radius:16px;padding:16px 18px;margin-bottom:24px}
/* Empareja */
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mc{min-height:58px;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:10px 12px;font-weight:700;text-align:left;transition:transform .12s,border-color .12s,opacity .3s}
.mc.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--sheet));transform:scale(1.02)}
.mc.ok{border-color:var(--ok);background:var(--ok-bg);opacity:.35;pointer-events:none}
.mc.no{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
@view-transition{navigation:auto}
::view-transition-old(root){animation:vtSale .18s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:vtEntra .32s cubic-bezier(.16,1,.3,1) both}
html[data-vt="paso"]::view-transition-old(root){animation-name:vtSaleIzq}
html[data-vt="paso"]::view-transition-new(root){animation-name:vtEntraDer}
.top{view-transition-name:cabecera}.mnav{view-transition-name:menu-movil}
::view-transition-group(cabecera),::view-transition-group(menu-movil){animation:none}
@keyframes vtSale{to{opacity:0;transform:translateY(-6px)}}
@keyframes vtEntra{from{opacity:0;transform:translateY(10px)}}
@keyframes vtSaleIzq{to{opacity:0;transform:translateX(-24px)}}
@keyframes vtEntraDer{from{opacity:0;transform:translateX(28px)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cheat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cheat h3{margin-bottom:6px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding-block:7px;border-bottom:1px dashed var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv b{color:var(--accent);text-align:right}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
ol.plan{padding-left:22px;display:grid;gap:8px;margin:0}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-block:24px 8px}
  .exams{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .stage{grid-template-columns:minmax(0,1fr)}
  .ctx{position:static;max-height:none}
  .score-hero{grid-template-columns:1fr}
  .nav{order:3;width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap}
  .stats{margin-left:auto}
}
/* ══ Voz del dojo (va detrás de la base a propósito) ══ */
html.lenis,html.lenis body{height:auto}
body{background:var(--paper);background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 0);background-size:22px 22px}
h1,h2,h3{font-weight:700;letter-spacing:-.015em}
.wrap{max-width:1180px}
.top{background:color-mix(in srgb,var(--paper) 82%,transparent);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px}
.brand{font:900 22px var(--f-display);letter-spacing:-.02em}
.brand-mark{width:34px;height:34px;border:0;border-radius:8px;background:var(--hanko);transform:rotate(-4deg)}
.brand-mark::after{content:"道";width:auto;height:auto;background:none;color:#fff;font:400 22px/1 var(--f-brush);border-radius:0}
.nav button{border-radius:8px}
.nav button[aria-current="page"]{background:var(--sumi);color:var(--on-sumi)}
.btn{border-radius:10px;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--ink) 60%,transparent)}
.btn.acc{color:#fff}
/* portada */
.dhero{position:relative;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:56px 40px;isolation:isolate;overflow-x:clip}
.dhero .kanji-bg{position:absolute;right:-2%;top:50%;transform:translateY(-50%);font:400 clamp(260px,38vw,520px)/1 var(--f-brush);color:color-mix(in srgb,var(--hanko) 13%,transparent);z-index:-1;pointer-events:none;user-select:none}
.dhero h1{font-size:clamp(42px,6.4vw,84px);font-weight:900;line-height:.98;letter-spacing:-.02em;word-spacing:.04em}
.dhero h1 .red{color:var(--hanko);font-style:italic}
.dhero .lead{font-size:clamp(17px,1.6vw,20px);color:var(--ink-2);max-width:50ch;margin:22px 0 26px}
.dhero .cta{display:flex;gap:10px;flex-wrap:wrap}
.dhero .cta .btn{padding:15px 24px;font-size:16px}
.figs{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.figs div{display:grid}
.figs b{font:900 38px/1 var(--f-display);letter-spacing:-.03em}
.figs span{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.today{background:var(--sumi);color:var(--on-sumi);border:0;border-radius:22px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.today .muted,.today .eyebrow,.today .sync{color:color-mix(in srgb,var(--on-sumi) 65%,transparent)}
.today .pill{background:color-mix(in srgb,var(--on-sumi) 12%,transparent);color:var(--on-sumi)}
.today .btn.ghost{background:color-mix(in srgb,var(--on-sumi) 12%,transparent);color:var(--on-sumi)}
.today::after{content:"稽古";position:absolute;right:-8px;bottom:-26px;font:400 120px/1 var(--f-brush);color:color-mix(in srgb,var(--on-sumi) 7%,transparent);pointer-events:none}
.today svg circle:first-child{stroke:color-mix(in srgb,var(--on-sumi) 14%,transparent)}
.today svg circle:last-child{stroke:var(--hanko)}
.marq{overflow:hidden;border-block:1px solid var(--line);margin-inline:calc(50% - 50vw);background:var(--sheet)}
.marq-in{display:flex;gap:48px;width:max-content;padding:14px 0;font:700 15px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);animation:marq 38s linear infinite}
.marq-in span{display:flex;gap:48px;align-items:center}
.marq-in i{font:400 22px var(--f-brush);color:var(--hanko);font-style:normal;text-transform:none}
@keyframes marq{to{transform:translateX(-50%)}}
.sec-title{margin-block:56px 18px;align-items:end}
.sec-title h2{font-size:clamp(30px,4vw,48px);font-weight:900;letter-spacing:-.03em}
.sec-title .num{font:700 13px var(--f-mono);color:var(--hanko);display:block;margin-bottom:6px;letter-spacing:.1em}
.exams{grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.exam-card{grid-column:span 2;border-radius:20px;padding:24px;background:var(--sheet);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .2s;will-change:transform}
.exam-card:hover{transform:translateY(-4px) rotate(-.3deg);box-shadow:0 26px 50px -30px color-mix(in srgb,var(--c) 80%,transparent)}
.exam-card.big-card{grid-column:span 4;background:var(--sumi);color:var(--on-sumi);border-color:transparent}
.exam-card.big-card .muted,.exam-card.big-card .meta,.exam-card.big-card .eyebrow{color:color-mix(in srgb,var(--on-sumi) 68%,transparent)}
.exam-card.big-card .dots i{border-color:color-mix(in srgb,var(--on-sumi) 22%,transparent)}
.exam-card .tag{font:900 clamp(28px,3vw,40px)/1 var(--f-display);letter-spacing:-.03em}
.exam-card .dots{grid-template-columns:repeat(auto-fill,minmax(14px,20px));gap:5px}
.exam-card .glyph{position:absolute;right:14px;top:6px;font:400 92px/1 var(--f-brush);color:color-mix(in srgb,var(--c) 18%,transparent);pointer-events:none}
.exam-card.kana-card{grid-column:span 2;--c:var(--n5)}
.kana-strip{display:flex;gap:6px;flex-wrap:wrap}
.kana-strip span{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--bubble);font:700 20px var(--f-jp)}
.prio{background:var(--hanko);color:#fff;border-radius:6px;transform:rotate(3deg)}
.badge{border-radius:12px;background:transparent}
.badge.on{border-color:var(--hanko);box-shadow:inset 0 0 0 1px var(--hanko)}
.badge.on b:first-child{color:var(--hanko)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.step{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:8px;align-content:start}
.step .k{font:400 44px/1 var(--f-brush);color:var(--hanko)}
.step h3{font-size:20px}
.step p{margin:0;color:var(--ink-2);font-size:15px}
.foot{margin-top:72px;padding:28px 0 8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--ink-2);font-size:14px}
/* vistas internas */
.ex-head{padding-block:40px 10px}
.ex-head h1{font-size:clamp(36px,6vw,64px);font-weight:900;letter-spacing:-.035em}
.tabs button[aria-selected="true"]{border-color:var(--accent)}
.tile,.card,.drill,.rv{border-radius:16px}
.tile.done .b{color:#fff}
.opt{border-radius:14px}
.opt.sel .bub,.opt.right .bub,.opt.wrong .bub{color:#fff}
.btn.acc,.play{color:#fff}
.fc{border-radius:24px}
/* kana y kanji */
.ksets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0 6px}
.kset{display:grid;gap:2px;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;transition:border-color .2s,transform .2s}
.kset span{font:700 26px var(--f-jp)}
.kset b{font:700 16px var(--f-display)}
.kset small{color:var(--ink-2)}
.kset.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--sheet));transform:translateY(-2px)}
.kwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.kside{position:sticky;top:78px}
.kh{font-size:18px;margin:18px 0 10px}
.kh:first-child{margin-top:0}
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kgrid.k3{grid-template-columns:repeat(6,minmax(0,1fr))}
.kgrid.kj{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.kc{display:grid;justify-items:center;gap:2px;padding:10px 4px 8px;background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;transition:transform .15s,border-color .15s,background .15s}
.kc:hover{transform:translateY(-2px);border-color:var(--accent)}
.kc .kch{font:700 30px/1.1 var(--f-jp)}
.kc small{font:700 11px var(--f-mono);color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc.empty{background:none;border:1.5px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.kc.seen{background:var(--warn-bg)} .kc.known{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.kc.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.kdet{display:grid;gap:4px}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:26px}
.cert{display:flex;flex-direction:column;gap:10px}.cert h3{margin:0;font-size:18px}.cert-top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.cert-abre{display:flex;flex-wrap:wrap;gap:6px}.cert-abre span{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--bubble)}
.cert-dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}.cert-dl dt{color:var(--ink-2)}.cert-dl dd{margin:0}
.cert-tip{margin:0;font-size:14px;line-height:1.5}.cert .row{margin-top:auto;align-items:center}.cert-conf{font-size:12px}
.certs-home{display:grid;grid-template-columns:1fr auto;gap:2px 14px;width:100%;text-align:left;padding:18px 22px;margin:18px 0;border:1px solid var(--line);border-radius:18px;background:var(--card,var(--paper));color:inherit;cursor:pointer;font:inherit}
.certs-home b{font-size:19px}.certs-home>span:last-child{grid-row:1/4;grid-column:2;align-self:center;font-size:24px}.certs-home:hover{border-color:var(--accent)}
.kpron{margin:8px 0 0;min-height:1.4em;font-weight:600}.kpron.ok{color:var(--ok)}.kpron.casi{color:var(--warn)}.kpron.mal{color:var(--bad,#c0392b)}
.btn.rec{animation:libLat 1s infinite}
.kbig{font:400 140px/1.1 var(--f-jp);text-align:center;color:var(--ink)}
.ktrick{background:var(--bubble);border-radius:12px;padding:12px 14px;margin:6px 0;display:grid;gap:4px;font-size:15.5px}
.kquiz{max-width:640px;margin:0 auto;display:grid;gap:16px}
.kprompt{text-align:center;font:800 54px/1.2 var(--f-display);padding:18px 0}
.kprompt .kqc{font:400 120px/1 var(--f-jp)}
.kopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kopts .kqc{font:700 30px var(--f-jp)}
.ktest-pick{max-width:640px}
.kgrid.kw{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kw .kc{padding:12px 8px 10px;gap:4px}
.kw .kc .kch{font-size:19px;line-height:1.25;text-align:center}
.kw .kc small{white-space:normal;text-align:center;font-family:var(--f-body);font-size:12.5px}
.kbig.long{font-size:44px;line-height:1.2;padding:18px 0}
.kprompt .kqc.long{font-size:44px}
.kopts .kqc.long{font-size:19px}
.kfrase{display:grid;gap:6px;background:var(--bubble);border-radius:12px;padding:12px 14px;margin:10px 0 0}
.kfrase [lang=ja]{font-size:17px;font-weight:700}
.kfrase .btn{justify-self:start;padding:6px 12px;font-size:13px}
.kcan{width:100%;max-width:420px;aspect-ratio:1;display:block;margin:0 auto;background:var(--sheet);border:1.5px solid var(--line);border-radius:18px;touch-action:none;cursor:crosshair}
.mnav,.kclose{display:none}
@media (max-width:820px){
  .top .nav{display:none}
  .mnav{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .mnav button{display:grid;justify-items:center;gap:1px;background:none;border:0;border-radius:12px;padding:6px 2px;font:700 10.5px var(--f-body);color:var(--ink-2)}
  .mnav button span{font:400 22px/1.1 var(--f-brush)}
  .mnav button[aria-current="page"]{color:var(--hanko);background:color-mix(in srgb,var(--hanko) 10%,transparent)}
  .wrap{padding-bottom:96px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;flex:none}
  .prio{position:static;justify-self:start;margin-bottom:-4px}
  .kwrap .kside{position:fixed;top:auto;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:24;max-height:62vh;overflow:auto;overscroll-behavior:contain;transform:translateY(115%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:0 8px}
  .kwrap .kside.open{transform:none}
  .kside .kdet{border-radius:22px 22px 0 0;box-shadow:0 -18px 40px -18px rgba(0,0,0,.45);padding-top:14px;position:relative}
  .kside .kbig{font-size:84px}.kside .kbig.long{font-size:34px;padding:8px 0}
  .kclose{display:grid;place-items:center;position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bubble);font-weight:800}
  .dhero .cta .btn{flex:1 1 auto;text-align:center}
  .figs{justify-content:space-between}
  .exam-card{padding:20px}
  .exam-card .tag{font-size:30px}
}
.vozbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:end;margin:12px 0 4px}
.vozbar label{display:grid;gap:4px;min-width:0}
.vozbar select{max-width:100%}
.ksets.k3s{grid-template-columns:repeat(3,minmax(0,1fr))}
.ptv{color:var(--pt);font-style:italic}
.meta{border-top:1px solid color-mix(in srgb,var(--on-sumi) 18%,transparent);padding-top:12px}
.meta summary{cursor:pointer;font-weight:700;list-style:none}
.meta summary::-webkit-details-marker{display:none}
.meta-n{font:900 30px/1 var(--f-display);color:var(--hanko)}
.meta-plan{margin:8px 0 0;font-size:14.5px;color:color-mix(in srgb,var(--on-sumi) 80%,transparent)}
.meta-f{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.meta-f .inp{background:color-mix(in srgb,var(--on-sumi) 10%,transparent);color:var(--on-sumi);border-color:color-mix(in srgb,var(--on-sumi) 22%,transparent);flex:1 1 140px;min-width:0}
.meta-f .inp option{color:#191612}
.reveal{opacity:0}
.no-fx .reveal{opacity:1}
@media (max-width:980px){.exams{grid-template-columns:repeat(2,minmax(0,1fr))}.exam-card,.exam-card.big-card,.exam-card.kana-card{grid-column:span 1}.exam-card.big-card{grid-column:1/-1}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .dhero{grid-template-columns:1fr;padding-block:30px 20px;gap:26px}
  .dhero .kanji-bg{top:20%;right:-12%}
  .exams{grid-template-columns:1fr}
  .kwrap{grid-template-columns:1fr}
  .kside{position:static}
  .ksets{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kset{padding:10px}.kset span{font-size:20px}.kset b{font-size:13px}
  .kgrid.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kc .kch{font-size:24px}
  .steps{grid-template-columns:1fr}
}
.nav button,.dock .btn{white-space:nowrap}
/* Atajos de teclado: ayuda con ? y pistas pequeñas (en móvil no hay teclado, se ocultan) */
.kb-help{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--sumi) 45%,transparent);backdrop-filter:blur(3px)}
.kb-help[hidden]{display:none}
.kb-box{background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:100%;max-width:680px;max-height:86vh;overflow:auto;padding:22px 24px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.kb-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.kb-head h2{margin:0;font-size:24px}
.kb-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 28px}
.kb-box h3{font:700 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--hanko);margin:16px 0 4px}
.kb-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kb-row span:first-child{flex:none}.kb-row span:last-child{color:var(--ink-2);text-align:right}
kbd{font:600 12px var(--f-mono);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;white-space:nowrap}
.kb-line{margin:-6px 0 14px}
/* Reto del día y código */
.reto{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;margin:26px 0;padding:22px 24px;border:1px solid var(--line);border-radius:20px;background:var(--sheet);box-shadow:var(--shadow)}
.reto h2{margin:6px 0 4px;font-size:clamp(22px,3vw,30px)}.reto p{margin:0}
.reto-bts{display:grid;grid-template-columns:repeat(4,minmax(76px,1fr));gap:8px}
.reto-b{display:grid;gap:2px;justify-items:center;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font:inherit;color:var(--ink);border-top:4px solid var(--c,var(--hanko))}
.reto-b span{font:600 12px var(--f-mono);color:var(--ink-2)}.reto-b.hecho span{color:var(--ok,#2e7d32)}
.reto-b:hover{transform:translateY(-2px)}
.cod{font:700 clamp(18px,4.4vw,26px) var(--f-mono);letter-spacing:.06em;text-align:center;padding:16px;border:2px dashed var(--hanko);border-radius:14px;background:var(--paper);word-break:break-all;user-select:all}
@media (max-width:720px){.reto{grid-template-columns:1fr}.reto-bts{grid-template-columns:repeat(2,1fr)}}
/* Clases */
.cls-fila{width:100%;background:none;border:0;border-top:1px dashed var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.cls-fila:hover b{color:var(--hanko)}
.cls-msgs{max-height:420px;min-height:160px;padding:6px 0;overflow:auto}
.cls-deb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.chat-box .chat-m.cls-deberes,.cls-msgs .chat-m.cls-deberes{border:2px solid var(--hanko);background:color-mix(in srgb,var(--hanko) 8%,var(--paper));color:var(--ink)}
.cls-de{font-weight:700;font-size:12px;opacity:.8}.cls-hacer{justify-self:start;margin-top:4px;padding:6px 12px;font-size:13px}
.cls-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cls-tabla{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
.cls-tabla th{font:700 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.cls-tabla td{padding:8px;border-bottom:1px dashed var(--line);vertical-align:middle}
/* Cuentas, amigos y chat */
@media (max-width:1440px){.nav [data-key]::after{display:none}}
.soc-btn{position:relative}.soc-btn>span:first-child{font-size:16px;line-height:1}
.soc-dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--hanko);color:#fff;font:700 11px/18px var(--f-mono);text-align:center;padding:0 4px}
.soc-chat{position:relative}
.soc-auth{max-width:520px;margin-top:8px}.soc-form{display:grid;gap:12px;margin-top:14px}.soc-form label{display:grid;gap:6px;font-weight:600;font-size:14px}

function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function hashStr(t){let x=2166136261;for(const c of t){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmtTime=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

function touchDay(nAnswered){
  const t=today();
  if(S.last!==t){const gap=S.last?dayDiff(S.last,t):0;

    if(gap===1)S.streak++;else if(gap>1&&S.streak&&(S.congelas||0)>=gap-1){S.congelas-=gap-1;S.streak++;toast(`❄ ${gap-1===1?"Un protector ha":gap-1+" protectores han"} salvado tu racha`)}else S.streak=1;
    S.last=t}
  if(S.daily.d!==t)S.daily={d:t,n:0};

const BANK={};
async function loadBank(x){
  if(BANK[x])return BANK[x];
  const r=await fetch("bank-"+x+".json");if(!r.ok)throw new Error("No se pudo cargar el banco de "+EX[x].short);
  const sets=await r.json();
  const byTask={};
  for(const s of sets){(byTask[s.task]??=[]).push(s)}
  BANK[x]={sets,byTask,byId:Object.fromEntries(sets.map(s=>[s.id,s]))};
  return BANK[x];
}
function pickTask(b,spec,r){const opts=spec.split("|").filter(t=>b.byTask[t]?.length);return opts.length?opts[Math.floor(r()*opts.length)]:null}
/* Examen k: cada tarea recorre su banco barajado en ventanas, así los 30 simulacros reparten el banco antes de repetir */
function buildExam(x,k,easy,full){
  const b=BANK[x], r=rng(hashStr(x+":"+k+(easy?"e":"")+(full?"f":"")));
  const items=[];
  for(const [spec,count] of (full?EX[x].full:easy?EX[x].easy:EX[x].blueprint)){
    const task=pickTask(b,spec,r);if(!task)continue;
    let pool=b.byTask[task];
    if(easy){const e=pool.filter(s=>s.lvl===1);if(e.length>=count)pool=e}
    const order=shuffle(pool,rng(hashStr(x+task)));
    for(let i=0;i<count;i++)items.push(...expand(order[(k*count+i)%order.length]));
  }
  return items;
}
function expand(s){
  if(!s.qs.length)return[{set:s,q:{t:"open"},qi:0}];
  return s.qs.map((q,qi)=>({set:s,q,qi}));
}
function buildDrill(x,sec,n=12){
  const b=BANK[x],r=rng(Date.now());
  const pool=shuffle(b.sets.filter(s=>s.sec===sec),r);
  const items=[];for(const s of pool){if(items.length>=n)break;items.push(...expand(s))}
  return items.slice(0,Math.max(n,items.length>n+4?n:items.length));
}
const qid=(x,it)=>x+":"+it.set.id+":"+it.qi;

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){voices=[]}}
try{speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}catch(e){}
function pickVoice(lang,gender){
  const pref=voices.filter(v=>v.lang.replace("_","-").startsWith(lang));
  const any=pref.length?pref:voices.filter(v=>v.lang.startsWith(lang.slice(0,2)));
  if(!any.length)return null;
  const male=/male|daniel|alex|fred|otoya|hattori|thomas|arthur|aaron|ichiro|keita|guy|ryan/i;
  const female=/female|samantha|karen|kyoko|serena|moira|susan|nanami|ava|allison|zira|libby|sonia|emma/i;
  const want=gender==="M"?male:female;
  return any.find(v=>want.test(v.name))||any[gender==="M"?Math.min(1,any.length-1):0];
}
function speakPack(lang,g){
  if(lang==="ja-JP")return S.voz==="sys"?null:(g==="M"?"n5m":"n5w");
  const a=S.vozEn||"auto";if(a==="sys")return null;
  return ((a==="auto"?(lang==="en-GB"?"gb":"us"):a))+(g==="M"?"m":"w");
}
function speak(script,lang,onEnd){
  stopVoz();
  try{speechSynthesis.cancel()}catch(e){onEnd&&onEnd(false);return}
  const lines=String(script).split(/\n+/).map(l=>l.trim()).filter(Boolean);
  let i=0;
  const next=()=>{
    if(i>=lines.length){onEnd&&onEnd(true);return}
    let line=lines[i++],g=null;
    const m=line.match(/^(M|W|男|女)\s*[:：]\s*(.*)$/);if(m){g=/M|男/.test(m[1])?"M":"W";line=m[2]}
    const tts=()=>{const u=new SpeechSynthesisUtterance(line);u.lang=lang;u.rate=lang==="ja-JP"?0.9:0.95;
      const v=pickVoice(lang,g||"W");if(v)u.voice=v;
      u.onend=()=>setTimeout(next,g?350:200);u.onerror=()=>next();
      speechSynthesis.speak(u)};
    const pq=speakPack(lang,g||"W");
    if(pq)playVoz(vozUrl(pq,line),tts,()=>setTimeout(next,g?350:200));else tts();
  };
  next();
}

function weakest(x){let w=null,wp=2;for(const [sec,st] of Object.entries(S.sec[x])){if(st[1]>=5&&st[0]/st[1]<wp){wp=st[0]/st[1];w=sec}}return w}
function lineChart(hs){
  const W=520,H=200,P=30,n=hs.length;
  const X=i=>P+i*(W-2*P)/(n-1), Y=v=>H-P-v*(H-2*P);

  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const grid=[0,.25,.5,.75,1].map(v=>`<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)" font-family="JetBrains Mono,monospace">${v*100}</text>`).join("");
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de tus notas en porcentaje">${grid}<path d="${path} L${last[0]} ${Y(0)} L${pts[0][0]} ${Y(0)} Z" fill="var(--accent)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--accent)"/>`).join("")}<circle cx="${last[0]}" cy="${last[1]}" r="6" fill="var(--sheet)" stroke="var(--accent)" stroke-width="3"/></svg>`;
}

  const per=x==="aws"?{mcq:120,multi:120}:{mcq:50,fill:45,order:60,multi:60,open:0};
  let secs=items.reduce((a,it)=>a+(per[it.q.t]??50)+(it.q.t==="open"?(it.set.sec==="writing"?(/Task 2|Discussion/.test(it.set.task)?600:420):90):0),0);
  run={x,key,mode,items,i:0,ans:{},title,start:Date.now(),limit:mode==="exam"?secs:0,plays:{},checked:{},rub:{}};

}

function buildReto(x,dia){const b=BANK[x],r=rng(hashStr("reto:"+x+":"+dia)),items=[];

  return items}

/* ============ Corrección y notas ============ */
function scoreItem(it,i){
  const q=it.q,a=run.ans[i];
  if(q.t!=="open")return isRight(it,a)?1:0;
  if(it.set.task==="Listen and Repeat"){const want=norm(it.set.model||it.set.audio).split(" ");const got=new Set(norm(a||"").split(" "));return want.filter(w=>got.has(w)).length/want.length}
  const r=run.rub[i]||{};const vals=[0,1,2,3].map(k=>r[k]).filter(v=>v!=null);return vals.length?vals.reduce((x,y)=>x+y,0)/(vals.length*4):0;
}
function bandFor(x,p,secP){
  if(x==="aws"){const sc=Math.round(100+900*p);return{s:sc+" / 1000",sub:`Aprobado con 720 · estimación lineal (AWS escala la nota y no publica la fórmula)`,pass:sc>=+(S.target.aws||720)}}
  if(x==="toefl"){const b=Math.max(1,Math.min(6,Math.round((1+5*p)*2)/2));const cefr=b>=6?"C2":b>=5?"C1":b>=4?"B2":b>=3?"B1":b>=2?"A2":"A1";return{s:"Banda "+b.toFixed(1),sub:"≈ "+cefr+" del MCER",pass:b>=+S.target.toefl}}
  if(x==="ielts"){const raw=Math.round(p*40);const t=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[0,2]];const b=t.find(r=>raw>=r[0])[1];return{s:"Banda "+b.toFixed(1),sub:"≈ "+raw+"/40 aciertos equivalentes",pass:b>=+S.target.ielts}}
  const lk=Math.round((secP.lk??p)*120),li=Math.round((secP.li??p)*60),tot=lk+li;const pass=tot>=80&&lk>=38&&li>=19;
  return{s:tot+" / 180",sub:`Lenguaje+Lectura ${lk}/120 (mín. 38) · Escucha ${li}/60 (mín. 19)`,pass};
}
function finish(){
  clearInterval(timerInt);try{speechSynthesis.cancel()}catch(e){}
  const x=run.x;let sum=0;const per={};
  run.items.forEach((it,i)=>{const sc=scoreItem(it,i);sum+=sc;const sec=it.set.sec;(per[sec]??=[0,0]);per[sec][0]+=sc;per[sec][1]++;
    if(it.q.t!=="open"){const st=(S.sec[x][sec]??=[0,0]);st[0]+=sc;st[1]++;if(sc<1)addCard(qid(x,it))}});
  const p=sum/run.items.length;
  let secP={};if(x==="n5"){const li=per.listening||[0,0];const lk=Object.entries(per).filter(([k])=>k!=="listening").reduce((a,[,v])=>[a[0]+v[0],a[1]+v[1]],[0,0]);secP={lk:lk[1]?lk[0]/lk[1]:p,li:li[1]?li[0]/li[1]:p}}
  const band=bandFor(x,p,secP);
  const correct=run.items.filter((it,i)=>scoreItem(it,i)>=1).length;
  const gained=correct*10+(run.key?40:0)+(p===1?100:0);
  S.xp+=gained;touchDay(run.items.length);
  if(run.key){const prev=S.exams[x][run.key];S.exams[x][run.key]={best:Math.max(prev?.best||0,p),s:band.s,pass:band.pass||prev?.pass||false,tries:(prev?.tries||0)+1};
    S.hist.push({x,k:run.key,p:+p.toFixed(3),s:band.s,d:Date.now()});if(S.hist.length>300)S.hist=S.hist.slice(-300)}
  if(run.key)award("first");if(p===1&&run.key)award("perfect");if(band.pass&&run.key)award("pass");
  if(Object.values(S.exams).reduce((a,e)=>a+Object.keys(e).length,0)>=10)award("ten");

  run=null;route={v:"result",x,res};render();scrollTo(0,0);
  if(band.pass||p>=.8)confetti();
}

function isRightAns(it,a){const q=it.q;if(q.t==="mcq")return a===q.a;if(q.t==="multi")return Array.isArray(a)&&a.length===q.a.length&&q.a.every(i=>a.includes(i));if(q.t==="fill")return a!=null&&q.a.some(v=>norm(v)===norm(a));if(q.t==="order")return Array.isArray(a)&&a.map(i=>q.w[i]).join(" ")===q.a;return true}

/* ============ Parejas (Empareja y Modo Rayo) ============ */
function pairsFor(x){
  if(EX[x].learn)return EX[x].learn.flatMap(([,items])=>items);
  const out=[],seen=new Set();
  for(const s of BANK[x].sets){const q=s.qs[0];if(!q||q.t!=="mcq"||s.passage||s.audio||!(s.sec==="vocab"||s.sec==="grammar"))continue;
    const m=q.q.match(/'([^']+)'/)||q.q.match(/【(.+?)】/);let front=m?m[1]:q.q.replace(/^Which (word|phrase) best (completes|paraphrases):?\s*/i,"");
    if(m&&/【/.test(q.q))front=q.q.replace(/【(.+?)】/,"[$1]");
    const back=q.o[q.a];if(front.length>70||seen.has(front))continue;seen.add(front);out.push([front,back])}
  return out;
}
let match=null;
function newMatch(x){const all=shuffle(pairsFor(x),rng(Date.now()));const used=new Set(),pick=[];
  for(const p of all){if(used.has(p[1]))continue;used.add(p[1]);pick.push(p);if(pick.length===5)break}
  match={x,pairs:pick,left:shuffle(pick.map((_,i)=>i),rng(Date.now()+1)),right:shuffle(pick.map((_,i)=>i),rng(Date.now()+2)),done:new Set(),sel:null,errors:0,t0:Date.now()}}
function renderMatch(){
  const box=$("#matchBox");if(!box)return;const m=match;
  if(m.done.size===m.pairs.length){const secs=Math.round((Date.now()-m.t0)/1000);
    box.innerHTML=`<p style="font:800 28px var(--f-display);margin:8px 0">${m.errors?"¡Hecho!":"¡Perfecto!"}</p><p class="muted">${secs} s · ${m.errors} fallos</p><button class="btn acc" id="mAgain">Otra ronda</button>`;
    $("#mAgain").onclick=()=>{newMatch(m.x);renderMatch()};return}
  const L=m.x==="n5"?' lang="ja"':"";
  box.innerHTML=`<div class="match"${L}><div style="display:grid;gap:10px">${m.left.map((i,k)=>`<button class="mc ${m.done.has(i)?"ok":""} ${m.sel===i?"sel":""}" data-ml="${i}"><span class="kb-n">${k+1}</span>${h(m.pairs[i][0])}</button>`).join("")}</div><div style="display:grid;gap:10px">${m.right.map((i,k)=>`<button class="mc ${m.done.has(i)?"ok":""}" data-mr="${i}"><span class="kb-n">${"ABCDE"[k]}</span>${h(m.pairs[i][1])}</button>`).join("")}</div></div>`;
  box.querySelectorAll("[data-ml]").forEach(b=>b.onclick=()=>{m.sel=+b.dataset.ml;renderMatch()});
  box.querySelectorAll("[data-mr]").forEach(b=>b.onclick=()=>{if(m.sel==null){toast("Primero toca una pista de la izquierda");return}
    const i=+b.dataset.mr;if(i===m.sel){m.done.add(i);m.sel=null;sfx(true);S.xp+=3;
      if(m.done.size===m.pairs.length){if(!m.errors){S.match[m.x]=(S.match[m.x]||0)+1;if(S.match[m.x]%5===0)confetti()}touchDay(m.pairs.length);save()}renderMatch()}
    else{m.errors++;sfx(false);b.classList.add("no");setTimeout(()=>b.classList.remove("no"),350)}});
}

function gcalUrl(){

const SRec=window.SpeechRecognition||window.webkitSpeechRecognition;
const kataHira=t=>t.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
const pronNorm=t=>kataHira(sinTilde(String(t).toLowerCase())).replace(/[\s、。，,.!?¡¿！？「」…~〜・\-]/g,"");
function lev(a,b){const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function pronParecido(dicho,objetivos){const x=pronNorm(dicho);let m=0;for(const o of objetivos){const y=pronNorm(o);if(!y)continue;m=Math.max(m,1-lev(x,y)/Math.max(x.length,y.length))}return m}
let pronRec=null;
function pronProbar(set,it,btn){const out=$("#kpron");if(!SRec||!out)return;if(pronRec){pronRec.abort();return}
  stopVoz();const r=new SRec();pronRec=r;r.lang=KPT(set)?kLang(set):"ja-JP";r.interimResults=false;r.maxAlternatives=5;
  btn.classList.add("rec");btn.textContent="● Te escucho…";out.className="kpron";out.textContent="Di la palabra ahora";
  const obj=[it.c,it.k,it.wr,it.r,kVoice(set,it),...String(it.c).split(" / ")].filter(Boolean);
  r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);let best=0,txt=alts[0]||"";for(const a of alts){const p=pronParecido(a,obj);if(p>best){best=p;txt=a}}
    const nivel=best>=.85?["ok","¡Perfecto! 🎯"]:best>=.55?["casi","Casi: escúchala otra vez y repite"]:["mal","No se entendió bien. Prueba más despacio"];
    out.className="kpron "+nivel[0];out.innerHTML=`${nivel[1]} <span class="muted">· he oído «${h(txt)}»</span>`;sfx(best>=.85);if(best>=.85){S.xp+=2;save()}};
  r.onerror=e=>{out.className="kpron mal";out.textContent=e.error==="not-allowed"?"Sin permiso para el micrófono":e.error==="no-speech"?"No te he oído. Pulsa y habla":"El reconocimiento necesita internet"};
  r.onend=()=>{pronRec=null;btn.classList.remove("rec");btn.textContent="🎙 Dilo tú"};

      <div class="row" style="margin-top:10px"><span class="eyebrow">Dirección</span><div class="seg"><button data-kdir="0" aria-pressed="${!route.kdir}">${set==="kanji"?"Kanji → significado":kWord(set)?"Japonés → español":"Letra → sonido"}</button><button data-kdir="1" aria-pressed="${!!route.kdir}">${set==="kanji"?"Significado → kanji":kWord(set)?"Español → japonés":"Sonido → letra"}</button></div></div></div>`;
  }else{
    const pool=L.filter(i=>!i.g), c=route.kd||pool[0].c;
    body=`<div class="grid2"><div class="card"><h3>Dibuja encima de la guía</h3><canvas id="kcan" class="kcan" width="560" height="560" aria-label="Lienzo para dibujar ${h(c)}"></canvas>
      <div class="row" style="margin-top:12px"><button class="btn ghost" id="kclr">Borrar</button><button class="btn ghost" id="kguide">Ocultar guía</button><button class="btn acc" id="knext">Otra →</button><button class="btn ghost" data-say="${h(set==="kanji"?(L.find(i=>i.c===c)||{}).wr:c)}">▶</button></div></div>
      <div class="card"><h3>Cómo practicar</h3><ol class="plan"><li>Dibuja 3 veces <b>con</b> la guía, diciendo el sonido en voz alta.</li><li>Oculta la guía y dibújalo de memoria.</li><li>Orden de trazos: de arriba abajo y de izquierda a derecha; las horizontales antes que las verticales que las cruzan.</li></ol>
      <p class="muted" style="font-size:14px">Ahora: <b lang="ja" style="font-size:22px">${h(c)}</b> ${h(set==="kanji"?(L.find(i=>i.c===c)||{}).m:(L.find(i=>i.c===c)||{}).r)}</p></div></div>`;
  }
  const tabs=kWord(set)?[["tabla","Palabras y frases"],["test","Test"]]:[["tabla","Tabla y trucos"],["test","Test"],["dibuja","Dibuja"]];
  return `<div class="ex-head"><div>${route.v==="ru"?`<span class="eyebrow">Desde cero · para la beca y la universidad</span><h1 style="margin-top:8px"><span class="ptv">Русский</span> desde cero</h1>`:route.v==="pt"?`<span class="eyebrow">Portugal · para vivir y estudiar</span><h1 style="margin-top:8px"><span class="ptv">Português</span> de Portugal</h1>`:`<span class="eyebrow">JLPT N5 · empieza aquí</span><h1 style="margin-top:8px"><span lang="ja">かな</span>, kanji y palabras</h1>`}</div><span class="pill ok">${known}/${L.length} dominados</span></div>
    <div class="ksets ${route.v!=="kana"?"k3s":""}">${sw}</div>${route.v!=="kana"?"":vozPicker(true)}
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-kt="${k}" aria-selected="${tab===k}">${l}</button>`).join("")}</div><p class="kbd kb-line">${({tabla:"Flechas: moverte · Espacio: escuchar",test:"1-4 o A-D: responder · Espacio: siguiente",dibuja:"Retroceso: borrar · V: guía · Intro: otra"})[tab]} · Shift+←→: pestañas · Shift+↑↓: conjunto · / buscar · ? ayuda</p>${body}`;
}
function kStartQuiz(set,kind){
  const L=KANA[set];let pool=kind==="basic"?L.filter(i=>!i.g):kind&&kind.startsWith("g:")?L.filter(i=>i.g===kind.slice(2)):L.slice();
  if(kind==="weak"){pool.sort((a,b)=>{const A=kStat(set,a.c),B=kStat(set,b.c);return (A[1]?A[0]/A[1]:.5)-(B[1]?B[0]/B[1]:.5)});pool=pool.slice(0,20)}
  const r=rng(Date.now());const qs=shuffle(pool,r).slice(0,10).map(it=>{
    const same=L.filter(o=>o.c!==it.c&&(KMEAN(set)||!!o.g===!!it.g));
    return {it,opts:shuffle([it,...shuffle(same,r).slice(0,3)],r)}});
  kq={set,qs,i:0,ok:0,ans:null,rev:!!route.kdir};render();
}
function kLabel(set,it,asAnswer){const rev=kq.rev;const showChar=asAnswer?rev:!rev;return showChar?`<span lang="${kLang(set)}" class="kqc ${kWord(set)?"long":""}">${h(it.c)}</span>`:h(kShow(set,it))}
function kQuizHTML(){
  if(kq.i>=kq.qs.length)return `<div class="card" style="text-align:center"><div class="big">${kq.ok}<span style="font-size:.4em">/10</span></div><p class="muted">${kq.ok>=9?"¡Muy bien! Pasa a «Todos» o a la dirección contraria.":kq.ok>=6?"Vas bien. Repite con «Los que más fallo».":"Vuelve a la tabla, lee los trucos y repite."}</p><div class="row" style="justify-content:center"><button class="btn acc" data-kq="again">Otra ronda</button><button class="btn ghost" data-kt="tabla">Ver la tabla</button></div></div>`;
  const {it,opts}=kq.qs[kq.i],set=kq.set,a=kq.ans;
  return `<div class="card kquiz"><div class="row" style="justify-content:space-between"><span class="eyebrow">${kq.i+1} / 10</span><span class="pill ok">${kq.ok} bien</span></div>
    <div class="kprompt">${kLabel(set,it,false)}</div>
    <div class="kopts">${opts.map((o,n)=>`<button class="opt ${a==null?"":o===it?"right":a===n?"wrong":""}" data-ka="${n}" ${a!=null?"disabled":""}><span class="bub">${"ABCD"[n]}</span><span>${kLabel(set,o,true)}</span></button>`).join("")}</div>
    ${a!=null?`<div class="feedback ${opts[a]===it?"ok":"bad"}"><b>${opts[a]===it?"¡Bien!":"Era "+h(it.c)+" · "+h(kShow(set,it))}</b>${it.t?`<span>${h(it.t)}</span>`:""}</div><button class="btn acc" data-knext="1">${kq.i===9?"Ver resultado":"Siguiente →"}</button>`:""}</div>`;
}
function kSay(){const set=kCur();kSpeak(set,kVoice(set,KANA[set].find(i=>i.c===kSel)||{c:kSel}))}
function kCur(){const g=KGRUPO[kGv()];return g.includes(route.k)?route.k:g[0]}
function kPick(b,byKey){kSel=b.dataset.kc;kSheet=true;$(".kside").classList.add("open");document.querySelectorAll(".kc.sel").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");$(".kside").innerHTML=kDetail(kCur());bindKana();
  if(byKey)b.scrollIntoView({block:"nearest"});if(window.gsap)gsap.from("#kdet .kbig",{scale:.6,opacity:0,duration:.4,ease:"back.out(2)"})}
/* Flechas por la tabla: izquierda/derecha siguen el orden; arriba/abajo buscan la celda más cercana en la fila de al lado (sirve con cualquier número de columnas) */
function kMove(k){const cs=[...document.querySelectorAll(".kc[data-kc]")];if(!cs.length)return;let cur=cs.findIndex(b=>b.classList.contains("sel"));if(cur<0)cur=0;let nx=cur;
  if(k==="ArrowLeft")nx=Math.max(0,cur-1);else if(k==="ArrowRight")nx=Math.min(cs.length-1,cur+1);
  else{const r=cs[cur].getBoundingClientRect(),dn=k==="ArrowDown";let bs=Infinity;cs.forEach((b,i)=>{const q=b.getBoundingClientRect(),dy=dn?q.top-r.top:r.top-q.top;if(dy<4)return;const sc=dy*1000+Math.abs(q.left-r.left);if(sc<bs){bs=sc;nx=i}})}
  if(nx!==cur||!cs[cur].classList.contains("sel"))kPick(cs[nx],true)}
function bindKana(){
  const kc=$("[data-kclose]");if(kc)kc.onclick=()=>{kSheet=false;$(".kside").classList.remove("open")};
  document.querySelectorAll("[data-kset]").forEach(b=>b.onclick=()=>{kSheet=false;route.k=b.dataset.kset;kSel=null;kq=null;route.kd=null;render()});
  document.querySelectorAll("[data-kt]").forEach(b=>b.onclick=()=>{route.kt=b.dataset.kt;if(b.dataset.kt!=="test")kq=null;render()});
  document.querySelectorAll("[data-kc]").forEach(b=>b.onclick=()=>{kPick(b);kSay()});
  document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>kSpeak(kCur(),b.dataset.say));
  document.querySelectorAll("[data-lento]").forEach(b=>b.onclick=()=>{vozRate=.7;kSpeak(kCur(),b.dataset.lento);vozRate=1});
  document.querySelectorAll("[data-pron]").forEach(b=>b.onclick=()=>{const set=kCur();pronProbar(set,KANA[set].find(i=>i.c===b.dataset.pron)||{c:b.dataset.pron},b)});
  document.querySelectorAll("[data-kdraw]").forEach(b=>b.onclick=()=>{route.kt="dibuja";route.kd=b.dataset.kdraw;render()});
  document.querySelectorAll("[data-kdir]").forEach(b=>b.onclick=()=>{route.kdir=b.dataset.kdir==="1";render()});
  document.querySelectorAll("[data-kq]").forEach(b=>b.onclick=()=>{const k=b.dataset.kq==="again"?kq.kind:b.dataset.kq;kStartQuiz(kCur(),k);kq.kind=k});
  document.querySelectorAll("[data-ka]").forEach(b=>b.onclick=()=>{const n=+b.dataset.ka,{it,opts}=kq.qs[kq.i];kq.ans=n;const ok=opts[n]===it;
    const id=kid(kq.set,it.c),st=S.kana[id]||[0,0];S.kana[id]=[st[0]+(ok?1:0),st[1]+1];if(ok){kq.ok++;S.xp+=2}sfx(ok);touchDay(1);save();kSpeak(kq.set,kVoice(kq.set,it));render()});
  const nx=$("[data-knext]");if(nx)nx.onclick=()=>{kq.i++;kq.ans=null;if(kq.i>=10&&kq.ok===10)confetti();render()};
  const can=$("#kcan");if(can)bindDraw(can);
}
function bindDraw(can){
  const set=route.k||"hira",L=KANA[set],pool=L.filter(i=>!i.g),g=can.getContext("2d");let guide=true,drawing=false,strokes=[];
  const c=route.kd||pool[0].c;
  const paint=()=>{const cs=getComputedStyle(document.documentElement);g.clearRect(0,0,560,560);
    g.strokeStyle=cs.getPropertyValue("--line");g.lineWidth=2;g.setLineDash([10,10]);g.beginPath();g.moveTo(280,0);g.lineTo(280,560);g.moveTo(0,280);g.lineTo(560,280);g.stroke();g.setLineDash([]);
    if(guide){g.fillStyle=cs.getPropertyValue("--bubble");g.font=`400 400px ${cs.getPropertyValue("--f-jp")}`;g.textAlign="center";g.textBaseline="middle";g.fillText(c,280,300)}
    g.strokeStyle=cs.getPropertyValue("--ink");g.lineWidth=22;g.lineCap="round";g.lineJoin="round";
    for(const s of strokes){g.beginPath();s.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()}};
  const pt=e=>{const r=can.getBoundingClientRect();return[(e.clientX-r.left)*560/r.width,(e.clientY-r.top)*560/r.height]};
  can.onpointerdown=e=>{drawing=true;can.setPointerCapture(e.pointerId);strokes.push([pt(e)]);paint()};
  can.onpointermove=e=>{if(drawing){strokes[strokes.length-1].push(pt(e));paint()}};
  can.onpointerup=can.onpointercancel=()=>{drawing=false};
  $("#kclr").onclick=()=>{strokes=[];paint()};
  $("#kguide").onclick=e=>{guide=!guide;e.target.textContent=guide?"Ocultar guía":"Mostrar guía";paint()};
  $("#knext").onclick=()=>{const i=pool.findIndex(x=>x.c===c);route.kd=pool[(i+1)%pool.length].c;render()};
  if(document.fonts)document.fonts.ready.then(paint);paint();
}

/* ============ Movimiento: GSAP + Lenis (si no cargan, la página se ve igual sin animar) ============ */
let lenis=null, fxIO=null;
function dojoFx(v){
  if(!window.gsap||matchMedia("(prefers-reduced-motion: reduce)").matches){document.documentElement.classList.add("no-fx");return}
  if(!lenis&&window.Lenis){lenis=new Lenis({stopInertiaOnNavigate:true,prevent:n=>!!(n.closest&&n.closest(".ctx,.chat,.model,.kcan,.kb-box"))});gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0)}
  if(fxIO)fxIO.disconnect();
  fxIO=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;fxIO.unobserve(e.target);gsap.to(e.target,{opacity:1,y:0,duration:.85,ease:"power3.out",delay:+e.target.dataset.d||0})}),{rootMargin:"0px 0px -6% 0px"});
  gsap.utils.toArray(".reveal").forEach((el,i)=>{gsap.set(el,{y:30});el.dataset.d=Math.min(i,7)*.07;fxIO.observe(el)});
  if(v==="home"){
    gsap.fromTo(".dhero .kanji-bg",{opacity:0,scale:.86,rotate:-8},{opacity:1,scale:1,rotate:0,duration:1.8,ease:"expo.out"});
    gsap.utils.toArray("[data-count]").forEach(el=>gsap.from(el,{textContent:0,duration:1.6,ease:"power2.out",snap:{textContent:1},delay:.4}));
  }
}

  const mf=$("#metaf");if(mf)mf.onsubmit=e=>{e.preventDefault();S.meta={fecha:$("#mfecha").value,examen:$("#mex").value,nota:$("#mnota").value.trim()};save();render();toast(S.meta.fecha?"Cuenta atrás guardada":"Fecha borrada")};

/* ============ Sonido y confeti ============ */
let actx=null;
// Acierto: dos notas que suben (do-mi); fallo: una nota grave y corta. Y un toque de vibración en el móvil
function sfx(ok){try{navigator.vibrate&&navigator.vibrate(ok?12:[25,40,25])}catch(e){}
  try{actx??=new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;
    (ok?[[1047,0],[1319,.09]]:[[196,0]]).forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?"triangle":"sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(ok?.07:.09,t0+d+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d+(ok?.32:.22));o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+.35)})}catch(e){}}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti");c.hidden=false;c.width=innerWidth;c.height=innerHeight;const g=c.getContext("2d");
  const cs=getComputedStyle(document.documentElement);const cols=["--aws","--toefl","--ielts","--n5","--ok"].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*cols.length)],a:1}));
  let f=0;(function tick(){g.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a-=.008;g.globalAlpha=Math.max(0,p.a);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()});if(++f<140)requestAnimationFrame(tick);else c.hidden=true})();
}
