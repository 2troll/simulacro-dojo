<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Dojo: simulacros gratis de AWS Solutions Architect, TOEFL, IELTS y JLPT N5, y hiragana, katakana y kanji explicados fácil.">
<meta name="theme-color" content="#f2ede3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13110e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dojo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dojo · simulacros y kana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Atkinson+Hyperlegible:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&family=Yuji+Syuku&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.27/dist/lenis.css">
<style>
/* Identidad «dojo»: papel washi, tinta sumi y el sello rojo (hanko). Cada examen conserva su color para orientarse. */
:root{
  --paper:#f2ede3; --sheet:#fbf8f2; --ink:#191612; --ink-2:#5a5248; --line:#ddd4c4; --bubble:#e9e2d4; --sumi:#191612; --on-sumi:#f2ede3;
  --hanko:#c8361d; --pt:#0b7a4b; --aws:#b4560a; --toefl:#1f5f99; --ielts:#b02a38; --n5:#5a3e9e; --accent:var(--hanko);
  --ok:#1f7a4c; --ok-bg:#dff0e3; --bad:#b8321f; --bad-bg:#f7e1db; --warn:#a96d12; --warn-bg:#f6ead0;
  --shadow:0 1px 0 rgba(25,22,18,.05),0 18px 40px -24px rgba(25,22,18,.45);
  --f-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-brush:"Yuji Syuku","Zen Kaku Gothic New",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13110e; --sheet:#1c1915; --ink:#efe8db; --ink-2:#b0a594; --line:#342e26; --bubble:#29241e; --sumi:#0b0a08; --on-sumi:#efe8db;
  --hanko:#ef6a4c; --pt:#3fc58a; --aws:#f2a052; --toefl:#69a9e6; --ielts:#ee7a85; --n5:#ab94ee;
  --ok:#5cc88f; --ok-bg:#15301f; --bad:#f08470; --bad-bg:#3a1c16; --warn:#e5b45a; --warn-bg:#382b12;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13110e; --sheet:#1c1915; --ink:#efe8db; --ink-2:#b0a594; --line:#342e26; --bubble:#29241e; --sumi:#0b0a08; --on-sumi:#efe8db;
  --hanko:#ef6a4c; --pt:#3fc58a; --aws:#f2a052; --toefl:#69a9e6; --ielts:#ee7a85; --n5:#ab94ee;
  --ok:#5cc88f; --ok-bg:#15301f; --bad:#f08470; --bad-bg:#3a1c16; --warn:#e5b45a; --warn-bg:#382b12;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -20px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
body[data-x="kana"]{--accent:var(--n5)} body[data-x="pt"]{--accent:var(--pt)} body[data-x="aws"]{--accent:var(--aws)} body[data-x="toefl"]{--accent:var(--toefl)} body[data-x="ielts"]{--accent:var(--ielts)} body[data-x="n5"]{--accent:var(--n5)}
.jp,[lang="ja"]{font-family:var(--f-jp)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font:700 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:800 20px var(--f-display);background:none;border:0;padding:0}
.brand-mark{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;position:relative}
.brand-mark::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--accent);transition:background .3s}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 12px;border-radius:999px;font-weight:700;color:var(--ink-2)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.stats{display:flex;gap:14px;align-items:center;font:700 14px var(--f-mono)}
.stat{display:flex;align-items:center;gap:5px}
.flame{width:14px;height:18px}
.sync{font:500 11px var(--f-mono);color:var(--ink-2)}

/* portada */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;padding-block:40px 24px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 30%,transparent) 62%)}
.hero p{max-width:52ch;font-size:18px;color:var(--ink-2)}
.today{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:grid;gap:14px}
.ring{display:flex;gap:16px;align-items:center}
.ring svg{flex:none}
.goal-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bubble);font:700 12px var(--f-mono)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.exams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-block:8px 32px}
.exam-card{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;overflow:hidden}
.exam-card:hover{transform:translateY(-2px);border-color:var(--c)}
.exam-card .tag{font:800 30px var(--f-display);color:var(--c)}
.exam-card .dots{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.exam-card .dots i{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line)}
.exam-card .dots i.done{background:var(--c);border-color:var(--c)}
.exam-card .dots i.pass{background:var(--c);border-color:var(--c);box-shadow:0 0 0 2px var(--sheet),0 0 0 3.5px var(--c)}
.exam-card .meta{display:flex;justify-content:space-between;gap:8px;font:700 13px var(--f-mono);color:var(--ink-2)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-block:28px 14px;flex-wrap:wrap}
.sec-title h2{font-size:26px}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--ink-2);font-size:14px}
.badge.on{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--sheet)}
.badge b{font-family:var(--f-display)}

/* vista de examen */
.ex-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-block:28px 8px}
.ex-head h1{font-size:clamp(30px,5vw,46px);font-weight:800}
.ex-head h1 span{color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-block:12px 20px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:700;color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:grid;gap:6px;justify-items:center;text-align:center;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile .n{font:800 22px var(--f-display)}
.tile .b{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 10px var(--f-mono)}
.tile.done .b{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.tile.easy{border-style:dashed}
.tile small{font:700 11px var(--f-mono);color:var(--ink-2)}
.mode-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--bubble);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{font-size:19px;margin-bottom:8px}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.drill{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:grid;gap:6px}
.drill:hover{border-color:var(--accent)}
.drill .bar{height:6px;border-radius:3px;background:var(--bubble);overflow:hidden}
.drill .bar i{display:block;height:100%;background:var(--accent)}
.trick{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding-block:14px;border-bottom:1px solid var(--line)}
.trick:last-child{border-bottom:0}
.trick .k{font:800 13px var(--f-mono);color:var(--accent);padding-top:3px}
.trick h4{margin:0;font:700 17px var(--f-display)}
.trick p{margin:0;grid-column:2;color:var(--ink-2);max-width:68ch}
table.fmt{width:100%;border-collapse:collapse;font-size:15px}
table.fmt th,table.fmt td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.fmt th{font:700 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.scroll-x{overflow-x:auto}
.chart svg{width:100%;height:auto;display:block}

/* corredor de preguntas */
.run{min-height:100%;display:grid;grid-template-rows:auto 1fr auto}
.run-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.run-top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center}
.progress{flex:1;height:8px;border-radius:4px;background:var(--bubble);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.timer{font:700 15px var(--f-mono)}
.timer.low{color:var(--bad)}
.x-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.stage{max-width:1080px;margin:0 auto;padding:20px 16px 120px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;width:100%}
.stage.solo{grid-template-columns:minmax(0,720px);justify-content:center}
.ctx{position:sticky;top:70px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:20px;max-height:calc(100vh - 110px);overflow:auto}
.ctx .passage{white-space:pre-wrap;font-size:16.5px;line-height:1.7;max-width:65ch}
.qbox{display:grid;gap:16px;min-width:0}
.qtask{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtext{font-size:20px;line-height:1.5;font-weight:700;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .bub{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink-2);display:grid;place-items:center;font:700 13px var(--f-mono);transition:all .15s}
.opt.sel{border-color:var(--accent)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--sheet);transform:scale(1.05)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.fill-in{width:100%;font:600 19px var(--f-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.order-line{min-height:58px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.order-pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 12px;font-weight:700;font-size:17px}
.chip:hover{border-color:var(--accent)}
.chip.star{border-color:var(--accent)}
.feedback{border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.feedback.ok{background:var(--ok-bg)} .feedback.bad{background:var(--bad-bg)}
.feedback b{font-family:var(--f-display);font-size:17px}
.audio-box{display:grid;gap:12px;justify-items:start}
.play{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--sheet);border:0;border-radius:999px;padding:12px 20px;font-weight:800}
.play:disabled{opacity:.45;cursor:not-allowed}
.wave{display:flex;gap:3px;height:22px;align-items:center}
.wave i{width:4px;border-radius:2px;background:var(--accent);height:30%;opacity:.5}
.wave.on i{animation:wv .9s ease-in-out infinite;opacity:1}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}
@keyframes wv{50%{height:100%}}
textarea.write{width:100%;min-height:240px;font:17px/1.6 var(--f-body);padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);resize:vertical}
.rubric{display:grid;gap:10px}
.rub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.model{white-space:pre-wrap;background:var(--bubble);border-radius:12px;padding:14px;font-size:15.5px;max-height:340px;overflow:auto}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:1080px;margin:0 auto;display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:800;background:var(--ink);color:var(--paper)}
.btn.acc{background:var(--accent);color:var(--sheet)}
.btn.ghost{background:var(--bubble);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.kbd{font:600 11px var(--f-mono);color:var(--ink-2)}

/* resultados */
.score-hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding-block:28px}
.big{font:800 clamp(64px,12vw,110px)/.9 var(--f-display);color:var(--accent);letter-spacing:-.03em}
.secbars{display:grid;gap:10px}
.secbar{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:14px}
.secbar .t{height:10px;background:var(--bubble);border-radius:5px;overflow:hidden}
.secbar .t i{display:block;height:100%;background:var(--accent)}
.review{display:grid;gap:12px}
.rv{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--sheet);display:grid;gap:6px}
.rv .q{font-weight:700;white-space:pre-wrap}

/* tarjetas (desliza) */
.deck{position:relative;height:340px;max-width:460px;margin:0 auto;touch-action:pan-y}
.fc{position:absolute;inset:0;background:var(--sheet);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px;display:grid;align-content:center;gap:12px;text-align:center;user-select:none;transition:transform .25s,opacity .25s}
.fc .front{font-size:22px;font-weight:700;white-space:pre-wrap}
.fc .back{color:var(--ink-2);font-size:15px}
.deck-ctrl{display:flex;justify-content:center;gap:12px;margin-top:18px}
.rayo-num{font:800 72px/1 var(--f-display);color:var(--accent)}
.combo{font:800 18px var(--f-mono);color:var(--warn)}

/* tutor y recordatorios */
.chat{display:grid;gap:10px;max-height:420px;overflow:auto;padding:4px}
.msg{padding:10px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap}
.msg.me{background:var(--accent);color:var(--sheet);justify-self:end}
.msg.ai{background:var(--bubble)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.inp,select.inp{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;box-shadow:var(--shadow)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);color:var(--ink);border-radius:14px;padding:12px 16px;margin-top:16px}
mark{background:color-mix(in srgb,var(--warn) 28%,transparent);color:inherit;border-radius:4px;padding:0 3px}
.opt.multi .bub{border-radius:8px}
.prio{position:absolute;top:16px;right:16px;background:var(--c);color:var(--sheet);font:800 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px}
.exam-card.big-card{grid-column:1/-1}
.full-tile{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sheet);border:2px solid var(--accent);border-radius:16px;padding:16px 18px;margin-bottom:24px}
/* Empareja */
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mc{min-height:58px;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:10px 12px;font-weight:700;text-align:left;transition:transform .12s,border-color .12s,opacity .3s}
.mc.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--sheet));transform:scale(1.02)}
.mc.ok{border-color:var(--ok);background:var(--ok-bg);opacity:.35;pointer-events:none}
.mc.no{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cheat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cheat h3{margin-bottom:6px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding-block:7px;border-bottom:1px dashed var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv b{color:var(--accent);text-align:right}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
ol.plan{padding-left:22px;display:grid;gap:8px;margin:0}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-block:24px 8px}
  .exams{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .stage{grid-template-columns:minmax(0,1fr)}
  .ctx{position:static;max-height:none}
  .score-hero{grid-template-columns:1fr}

function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ============ Bancos ============ */
const BANK={};
async function loadBank(x){
  if(BANK[x])return BANK[x];
  const r=await fetch("bank-"+x+".json");if(!r.ok)throw new Error("No se pudo cargar el banco de "+EX[x].short);
  const sets=await r.json();
  const byTask={};
  for(const s of sets){(byTask[s.task]??=[]).push(s)}
  BANK[x]={sets,byTask,byId:Object.fromEntries(sets.map(s=>[s.id,s]))};
  return BANK[x];
}
function pickTask(b,spec,r){const opts=spec.split("|").filter(t=>b.byTask[t]?.length);return opts.length?opts[Math.floor(r()*opts.length)]:null}
/* Examen k: cada tarea recorre su banco barajado en ventanas, así los 30 simulacros reparten el banco antes de repetir */
function buildExam(x,k,easy,full){
  const b=BANK[x], r=rng(hashStr(x+":"+k+(easy?"e":"")+(full?"f":"")));
  const items=[];
  for(const [spec,count] of (full?EX[x].full:easy?EX[x].easy:EX[x].blueprint)){
    const task=pickTask(b,spec,r);if(!task)continue;
    let pool=b.byTask[task];
    if(easy){const e=pool.filter(s=>s.lvl===1);if(e.length>=count)pool=e}
    const order=shuffle(pool,rng(hashStr(x+task)));
    for(let i=0;i<count;i++)items.push(...expand(order[(k*count+i)%order.length]));
  }
  return items;
}
function expand(s){
  if(!s.qs.length)return[{set:s,q:{t:"open"},qi:0}];
  return s.qs.map((q,qi)=>({set:s,q,qi}));
}
function buildDrill(x,sec,n=12){
  const b=BANK[x],r=rng(Date.now());
  const pool=shuffle(b.sets.filter(s=>s.sec===sec),r);
  const items=[];for(const s of pool){if(items.length>=n)break;items.push(...expand(s))}
  return items.slice(0,Math.max(n,items.length>n+4?n:items.length));
}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){voices=[]}}
try{speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}catch(e){}
function pickVoice(lang,gender){
  const pref=voices.filter(v=>v.lang.replace("_","-").startsWith(lang));
  const any=pref.length?pref:voices.filter(v=>v.lang.startsWith(lang.slice(0,2)));
  if(!any.length)return null;
  const male=/male|daniel|alex|fred|otoya|hattori|thomas|arthur|aaron|ichiro|keita|guy|ryan/i;
  const female=/female|samantha|karen|kyoko|serena|moira|susan|nanami|ava|allison|zira|libby|sonia|emma/i;
  const want=gender==="M"?male:female;
  return any.find(v=>want.test(v.name))||any[gender==="M"?Math.min(1,any.length-1):0];
}
function speakPack(lang,g){
  if(lang==="ja-JP")return S.voz==="sys"?null:(g==="M"?"n5m":"n5w");
  const a=S.vozEn||"auto";if(a==="sys")return null;
  return ((a==="auto"?(lang==="en-GB"?"gb":"us"):a))+(g==="M"?"m":"w");
}
function speak(script,lang,onEnd){
  stopVoz();
  try{speechSynthesis.cancel()}catch(e){onEnd&&onEnd(false);return}
  const lines=String(script).split(/\n+/).map(l=>l.trim()).filter(Boolean);
  let i=0;
  const next=()=>{
    if(i>=lines.length){onEnd&&onEnd(true);return}
    let line=lines[i++],g=null;
    const m=line.match(/^(M|W|男|女)\s*[:：]\s*(.*)$/);if(m){g=/M|男/.test(m[1])?"M":"W";line=m[2]}
    const tts=()=>{const u=new SpeechSynthesisUtterance(line);u.lang=lang;u.rate=lang==="ja-JP"?0.9:0.95;
      const v=pickVoice(lang,g||"W");if(v)u.voice=v;
      u.onend=()=>setTimeout(next,g?350:200);u.onerror=()=>next();
      speechSynthesis.speak(u)};
    const pq=speakPack(lang,g||"W");
    if(pq)playVoz(vozUrl(pq,line),tts,()=>setTimeout(next,g?350:200));else tts();
  };
  next();
}

function weakest(x){let w=null,wp=2;for(const [sec,st] of Object.entries(S.sec[x])){if(st[1]>=5&&st[0]/st[1]<wp){wp=st[0]/st[1];w=sec}}return w}
function lineChart(hs){
  const W=520,H=200,P=30,n=hs.length;

  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const grid=[0,.25,.5,.75,1].map(v=>`<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)" font-family="JetBrains Mono,monospace">${v*100}</text>`).join("");
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de tus notas en porcentaje">${grid}<path d="${path} L${last[0]} ${Y(0)} L${pts[0][0]} ${Y(0)} Z" fill="var(--accent)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--accent)"/>`).join("")}<circle cx="${last[0]}" cy="${last[1]}" r="6" fill="var(--sheet)" stroke="var(--accent)" stroke-width="3"/></svg>`;
}

  let secs=items.reduce((a,it)=>a+(per[it.q.t]??50)+(it.q.t==="open"?(it.set.sec==="writing"?(/Task 2|Discussion/.test(it.set.task)?600:420):90):0),0);
  run={x,key,mode,items,i:0,ans:{},title,start:Date.now(),limit:mode==="exam"?secs:0,plays:{},checked:{},rub:{}};

function isRightAns(it,a){const q=it.q;if(q.t==="mcq")return a===q.a;if(q.t==="multi")return Array.isArray(a)&&a.length===q.a.length&&q.a.every(i=>a.includes(i));if(q.t==="fill")return a!=null&&q.a.some(v=>norm(v)===norm(a));if(q.t==="order")return Array.isArray(a)&&a.map(i=>q.w[i]).join(" ")===q.a;return true}

/* ============ Parejas (Empareja y Modo Rayo) ============ */
function pairsFor(x){
  if(EX[x].learn)return EX[x].learn.flatMap(([,items])=>items);
  const out=[],seen=new Set();
  for(const s of BANK[x].sets){const q=s.qs[0];if(!q||q.t!=="mcq"||s.passage||s.audio||!(s.sec==="vocab"||s.sec==="grammar"))continue;
    const m=q.q.match(/'([^']+)'/)||q.q.match(/【(.+?)】/);let front=m?m[1]:q.q.replace(/^Which (word|phrase) best (completes|paraphrases):?\s*/i,"");
    if(m&&/【/.test(q.q))front=q.q.replace(/【(.+?)】/,"[$1]");
    const back=q.o[q.a];if(front.length>70||seen.has(front))continue;seen.add(front);out.push([front,back])}
  return out;
}
let match=null;
function newMatch(x){const all=shuffle(pairsFor(x),rng(Date.now()));const used=new Set(),pick=[];
  for(const p of all){if(used.has(p[1]))continue;used.add(p[1]);pick.push(p);if(pick.length===5)break}
  match={x,pairs:pick,left:shuffle(pick.map((_,i)=>i),rng(Date.now()+1)),right:shuffle(pick.map((_,i)=>i),rng(Date.now()+2)),done:new Set(),sel:null,errors:0,t0:Date.now()}}
function renderMatch(){
  const box=$("#matchBox");if(!box)return;const m=match;
  if(m.done.size===m.pairs.length){const secs=Math.round((Date.now()-m.t0)/1000);
    box.innerHTML=`<p style="font:800 28px var(--f-display);margin:8px 0">${m.errors?"¡Hecho!":"¡Perfecto!"}</p><p class="muted">${secs} s · ${m.errors} fallos</p><button class="btn acc" id="mAgain">Otra ronda</button>`;
    $("#mAgain").onclick=()=>{newMatch(m.x);renderMatch()};return}
  const L=m.x==="n5"?' lang="ja"':"";
  box.innerHTML=`<div class="match"${L}><div style="display:grid;gap:10px">${m.left.map((i,k)=>`<button class="mc ${m.done.has(i)?"ok":""} ${m.sel===i?"sel":""}" data-ml="${i}"><span class="kb-n">${k+1}</span>${h(m.pairs[i][0])}</button>`).join("")}</div><div style="display:grid;gap:10px">${m.right.map((i,k)=>`<button class="mc ${m.done.has(i)?"ok":""}" data-mr="${i}"><span class="kb-n">${"ABCDE"[k]}</span>${h(m.pairs[i][1])}</button>`).join("")}</div></div>`;
  box.querySelectorAll("[data-ml]").forEach(b=>b.onclick=()=>{m.sel=+b.dataset.ml;renderMatch()});
  box.querySelectorAll("[data-mr]").forEach(b=>b.onclick=()=>{if(m.sel==null){toast("Primero toca una pista de la izquierda");return}
    const i=+b.dataset.mr;if(i===m.sel){m.done.add(i);m.sel=null;sfx(true);S.xp+=3;
      if(m.done.size===m.pairs.length){if(!m.errors){S.match[m.x]=(S.match[m.x]||0)+1;if(S.match[m.x]%5===0)confetti()}touchDay(m.pairs.length);save()}renderMatch()}
    else{m.errors++;sfx(false);b.classList.add("no");setTimeout(()=>b.classList.remove("no"),350)}});
}

let rayo=null;
function viewRayo(){
  const x=route.x;
  if(!rayo||rayo.done){return `<div class="ex-head"><div><button class="x-btn" data-exam="${x}">← ${EX[x].short}</button><h1 style="margin-top:12px">Modo <span>Rayo</span></h1></div></div>

    ${rayo?.done?`<p class="rayo-num">${rayo.score}</p><p class="muted">aciertos · récord ${S.rayo[x]}</p>`:`<p class="muted">Récord actual: <b>${S.rayo[x]||0}</b></p>`}
    <button class="btn acc" id="rgo">${rayo?.done?"Otra vez":"¡Empezar!"}</button></div>`}
  const q=rayo.q,ord=shuffle(q.o.map((_,i)=>i),rng(rayo.n*7+1));
  return `<div class="ex-head"><div><span class="eyebrow">Modo Rayo · ${EX[x].short}</span><div class="row" style="margin-top:6px"><span class="rayo-num" style="font-size:54px">${rayo.score}</span>${rayo.combo>=3?`<span class="combo">COMBO ×2</span>`:""}</div></div><span class="timer mono" id="rt" style="font-size:28px">${Math.ceil(rayo.left)}</span></div>

function bindRayo(){
  const x=route.x;
  const g=$("#rgo");if(g)g.onclick=async()=>{await loadBank(x);const pool=pairsFor(x);if(pool.length<4){toast("Aún no hay suficientes parejas");return}
    rayo={pool:shuffle(pool,rng(Date.now())),n:0,score:0,combo:0,left:60,end:Date.now()+60000};nextRayo();render();
    rayo.int=setInterval(()=>{rayo.left=(rayo.end-Date.now())/1000;const el=$("#rt");if(el)el.textContent=Math.max(0,Math.ceil(rayo.left));if(rayo.left<=0)endRayo()},200)};
  document.querySelectorAll("[data-ro]").forEach(b=>b.onclick=()=>{const ok=+b.dataset.ro===rayo.q.a;sfx(ok);
    if(ok){rayo.combo++;rayo.score+=rayo.combo>=3?2:1}else{rayo.combo=0;rayo.end-=3000}
    b.classList.add(ok?"right":"wrong");setTimeout(()=>{if(!rayo.done){nextRayo();render()}},ok?120:450)});
}
/* Cada pregunta del Rayo es una pareja con tres respuestas de otras parejas como señuelo */
function nextRayo(){const p=rayo.pool[rayo.n++%rayo.pool.length];const others=shuffle(rayo.pool.filter(o=>o[1]!==p[1]),rng(rayo.n*13)).map(o=>o[1]).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
  rayo.q={q:p[0],o:[p[1],...others],a:0}}
function endRayo(){clearInterval(rayo.int);rayo.done=true;const x=route.x;if(rayo.score>(S.rayo[x]||0)){S.rayo[x]=rayo.score;toast("¡Nuevo récord!");confetti()}
  S.xp+=rayo.score*4;touchDay(rayo.n);if(rayo.score>=20)award("rayo20");save();render()}

  const paint=()=>{const cs=getComputedStyle(document.documentElement);g.clearRect(0,0,560,560);
    g.strokeStyle=cs.getPropertyValue("--line");g.lineWidth=2;g.setLineDash([10,10]);g.beginPath();g.moveTo(280,0);g.lineTo(280,560);g.moveTo(0,280);g.lineTo(560,280);g.stroke();g.setLineDash([]);
    if(guide){g.fillStyle=cs.getPropertyValue("--bubble");g.font=`400 400px ${cs.getPropertyValue("--f-jp")}`;g.textAlign="center";g.textBaseline="middle";g.fillText(c,280,300)}
    g.strokeStyle=cs.getPropertyValue("--ink");g.lineWidth=22;g.lineCap="round";g.lineJoin="round";
    for(const s of strokes){g.beginPath();s.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()}};
  const pt=e=>{const r=can.getBoundingClientRect();return[(e.clientX-r.left)*560/r.width,(e.clientY-r.top)*560/r.height]};
  can.onpointerdown=e=>{drawing=true;can.setPointerCapture(e.pointerId);strokes.push([pt(e)]);paint()};
  can.onpointermove=e=>{if(drawing){strokes[strokes.length-1].push(pt(e));paint()}};
  can.onpointerup=can.onpointercancel=()=>{drawing=false};
  $("#kclr").onclick=()=>{strokes=[];paint()};
  $("#kguide").onclick=e=>{guide=!guide;e.target.textContent=guide?"Ocultar guía":"Mostrar guía";paint()};
  $("#knext").onclick=()=>{const i=pool.findIndex(x=>x.c===c);route.kd=pool[(i+1)%pool.length].c;render()};
  if(document.fonts)document.fonts.ready.then(paint);paint();
}

/* ============ Movimiento: GSAP + Lenis (si no cargan, la página se ve igual sin animar) ============ */
let lenis=null, fxIO=null;
function dojoFx(v){
  if(!window.gsap||matchMedia("(prefers-reduced-motion: reduce)").matches){document.documentElement.classList.add("no-fx");return}
  if(!lenis&&window.Lenis){lenis=new Lenis({stopInertiaOnNavigate:true,prevent:n=>!!(n.closest&&n.closest(".ctx,.chat,.model,.kcan,.kb-box"))});gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0)}
  if(fxIO)fxIO.disconnect();
  fxIO=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;fxIO.unobserve(e.target);gsap.to(e.target,{opacity:1,y:0,duration:.85,ease:"power3.out",delay:+e.target.dataset.d||0})}),{rootMargin:"0px 0px -6% 0px"});
  gsap.utils.toArray(".reveal").forEach((el,i)=>{gsap.set(el,{y:30});el.dataset.d=Math.min(i,7)*.07;fxIO.observe(el)});
  if(v==="home"){
    gsap.fromTo(".dhero .kanji-bg",{opacity:0,scale:.86,rotate:-8},{opacity:1,scale:1,rotate:0,duration:1.8,ease:"expo.out"});
    gsap.utils.toArray("[data-count]").forEach(el=>gsap.from(el,{textContent:0,duration:1.6,ease:"power2.out",snap:{textContent:1},delay:.4}));
  }
}

/* ============ Enlaces comunes ============ */
function bindCommon(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.go==="cards")deck=null;go({v:b.dataset.go})});
  document.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>{go({v:"exam",x:b.dataset.exam,tab:"sims"});loadBank(b.dataset.exam).catch(e=>toast(e.message))});
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{route.tab=b.dataset.tab;render()});
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{route.mode=b.dataset.mode;render()});
  document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{const k=b.dataset.start;startRun(route.x,k,route.mode||"exam",null,EX[route.x].short+" · "+(k[0]==="c"?"Calentamiento "+k.slice(1):"Simulacro "+k.slice(1)))});
  document.querySelectorAll("[data-drill]").forEach(b=>b.onclick=async()=>{const x=route.x;await loadBank(x);startRun(x,null,"study",buildDrill(x,b.dataset.drill),EX[x].short+" · "+SEC_LABEL[b.dataset.drill])});
  document.querySelectorAll("[data-rayo]").forEach(b=>b.onclick=()=>{rayo=null;go({v:"rayo",x:route.x})});
  document.querySelectorAll("[data-explain]").forEach(b=>b.onclick=()=>{const r=route.res,it=r.items[+b.dataset.explain];const q=it.q;
    ask(`Pregunta de ${EX[r.x].name} (${it.set.task}). ${it.set.passage?"Texto: "+it.set.passage.slice(0,1200):""}${it.set.audio?"Audio: "+it.set.audio.slice(0,1200):""}\nPregunta: ${q.q}\n${q.o?"Opciones: "+q.o.join(" | "):""}\nCorrecta: ${solText(q)}\nExplica por qué es la correcta, por qué fallé y un truco para la próxima.`,$("#ex"+b.dataset.explain))});
  const mf=$("#metaf");if(mf)mf.onsubmit=e=>{e.preventDefault();S.meta={fecha:$("#mfecha").value,examen:$("#mex").value,nota:$("#mnota").value.trim()};save();render();toast(S.meta.fecha?"Cuenta atrás guardada":"Fecha borrada")};
  const qk=$("[data-quick]");if(qk)qk.onclick=async()=>{const x="aws";await loadBank(x);const sec=weakest(x)||EX[x].secs[0];startRun(x,null,"study",buildDrill(x,sec,8),EX[x].short+" · práctica rápida")};
}

/* ============ Sonido y confeti ============ */
let actx=null;
function sfx(ok){try{actx??=new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=ok?880:220;g.gain.setValueAtTime(.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.18);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.2)}catch(e){}}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti");c.hidden=false;c.width=innerWidth;c.height=innerHeight;const g=c.getContext("2d");
  const cs=getComputedStyle(document.documentElement);const cols=["--aws","--toefl","--ielts","--n5","--ok"].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*cols.length)],a:1}));
  let f=0;(function tick(){g.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a-=.008;g.globalAlpha=Math.max(0,p.a);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()});if(++f<140)requestAnimationFrame(tick);else c.hidden=true})();
}

function start(){loadLocal();render();connectStore();connectExtras()}
start();
